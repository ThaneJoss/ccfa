name: Build and release CCFA

on:
  push:
    branches: [main]
    paths: [manifest.json, scripts/smoke-zotero.py, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccfa-release
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
    uses: ThaneJoss/github-ci/.github/workflows/ci.yml@main

  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require completed quality checks for this release
        env:
          QUALITY_PASSED: ${{ needs.quality.outputs.quality-passed }}
        shell: bash
        run: |
          if [[ "$QUALITY_PASSED" != "true" ]]; then
            echo "::error::Quality checks did not return completion proof for this release."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build deterministic XPI
        run: python3 scripts/build.py
      - name: Publish a new version without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag exists without a release; inspect it before publishing."
            exit 1
          fi
          gh release create "$tag" \
            "dist/ccfa-$version.xpi" dist/updates.json dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "CCFA $version" \
            --notes-file RELEASE_NOTES.md --latest
